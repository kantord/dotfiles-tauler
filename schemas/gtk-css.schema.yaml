# A schema for the one thing a GTK4 / libadwaita app takes from the user's gtk.css that a theme
# is made of: named colours, `@define-color <name> <value>;`.
#
# The names are libadwaita's own public API (window_bg_color, accent_bg_color, headerbar_*, ...),
# so a value here recolours every libadwaita application at once. This schema does not list them:
# any `[a-z0-9_]+` name is accepted, because the set grows with libadwaita (the sidebar colours
# arrived in 1.4, the accent colour in 1.6) and a typo in one is harmless — GTK ignores a colour
# nothing reads.
#
# Deliberately not the whole of GTK's CSS: selectors and properties are a language of their own,
# and a theme that needs them is a stylesheet, not a palette.
nodes:
  - component: GtkCss
    root: true
    container: true
    children_as: colors

  # `@define-color <name> <value>;` — a hex colour, or the `rgba()` / `alpha()` forms libadwaita's
  # own stylesheet writes for its translucent shades.
  - component: DefineColor
    props:
      name: { pattern: '^[a-z][a-z0-9_]*$' }
      value: { pattern: '^(#[0-9a-fA-F]{6}([0-9a-fA-F]{2})?|rgba?\([0-9., ]+\)|alpha\(#[0-9a-fA-F]{6}, ?[0-9.]+\))$' }
---
template: |
  /* GENERATED by tauler from gtk-css.schema.yaml — do not edit by hand,
     edit ~/.config/tauler/layout.op.mdx instead. */
  {% for color in colors %}
  @define-color {{ color.name }} {{ color.value }};
  {%- endfor %}
